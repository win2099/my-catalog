backend:
  name: github
  repo: win2099/my-catalog
  branch: main
  base_url: https://my-catalog.aettfda68.workers.dev
  auth_endpoint: auth

media_folder: "images"
public_folder: "/images"

collections:
  - name: "cards"
    label: "卡片列表"
    folder: "content/cards"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "编号", name: "number", widget: "string", required: true }
      - { label: "重点", name: "highlight", widget: "string", required: true }
      - { label: "封面图片", name: "image", widget: "image" }
      - { label: "详细描述", name: "body", widget: "text" }
      - { label: "排序", name: "order", widget: "number", default: 100 }
